<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL ID Formatter — Summer Hamilton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:           #0a0a0a;
      --fg:           #ffffff;
      --fg-body:      #cccccc;
      --fg-muted:     #888888;
      --accent:       #faff69;
      --accent-hover: #e6eb52;
      --on-accent:    #0a0a0a;
      --border:       #2a2a2a;
      --border-strong:#3a3a3a;
      --surface:      #1a1a1a;
      --surface-2:    #242424;
      --error:        #ef4444;

      --font-display: 'Inter', system-ui, sans-serif;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', ui-monospace, monospace;

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    html {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans), system-ui, sans-serif;
    }

    /* ─── Nav ──────────────────────────────────────────────────────── */

    .nav {
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-wordmark {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      color: var(--fg);
      text-decoration: none;
      transition: color 150ms var(--ease);
    }

    .nav-wordmark:hover { color: var(--accent); }

    .nav-back {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 150ms var(--ease);
    }

    .nav-back:hover { color: var(--accent); }

    /* ─── Container ────────────────────────────────────────────────── */

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 24px 48px;
    }

    /* ─── Header ───────────────────────────────────────────────────── */

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .header h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 2.25rem;
      line-height: 1.1;
      letter-spacing: -0.025em;
      color: var(--fg);
      margin-bottom: 12px;
    }

    .header p {
      font-size: 0.9375rem;
      font-weight: 400;
      color: var(--fg-body);
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 40px;
    }

    /* ─── Field label ──────────────────────────────────────────────── */

    .field-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 10px;
    }

    .section {
      margin-bottom: 24px;
    }

    /* ─── Textareas ────────────────────────────────────────────────── */

    textarea {
      width: 100%;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0;
      resize: vertical;
      outline: none;
      transition: border-color 150ms var(--ease);
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: var(--fg-muted);
      opacity: 0.5;
    }

    #input-ids {
      min-height: 200px;
    }

    #output-text {
      min-height: 120px;
      background: var(--surface-2);
      cursor: default;
    }

    /* ─── Format selector ──────────────────────────────────────────── */

    .format-selector {
      display: flex;
      border: 1px solid var(--border);
      margin-top: 12px;
    }

    .format-option {
      position: relative;
      flex: 1;
    }

    .format-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .format-option label {
      display: block;
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--fg-muted);
      background: var(--surface);
      cursor: pointer;
      border-right: 1px solid var(--border);
      margin: 0;
      text-align: center;
      transition: color 150ms var(--ease), background 150ms var(--ease);
      user-select: none;
    }

    .format-option:last-child label {
      border-right: none;
    }

    .format-option input[type="radio"]:checked + label {
      color: var(--on-accent);
      background: var(--accent);
    }

    .format-option label:hover {
      color: var(--fg);
    }

    .format-option input[type="radio"]:checked + label:hover {
      color: var(--on-accent);
    }

    /* ─── Primary button ───────────────────────────────────────────── */

    .btn-primary {
      width: 100%;
      padding: 13px 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 0;
      cursor: pointer;
      transition: background 150ms var(--ease), color 150ms var(--ease);
      margin-bottom: 40px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: var(--on-accent);
    }

    /* ─── Output section ───────────────────────────────────────────── */

    .output-section {
      display: none;
      border-top: 1px solid var(--border);
      padding-top: 40px;
    }

    .output-section.visible {
      display: block;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .output-header .field-label {
      margin: 0;
    }

    .btn-copy {
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--fg-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0;
      cursor: pointer;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
    }

    .btn-copy:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-copy.copied {
      color: var(--accent);
      border-color: var(--accent);
    }

    .status-line {
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg-muted);
    }

    .reset-link {
      display: inline-block;
      margin-top: 24px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--fg-muted);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      transition: color 150ms var(--ease);
    }

    .reset-link:hover {
      color: var(--accent);
    }

    /* ─── Footer ───────────────────────────────────────────────────── */

    .footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      margin-top: 96px;
    }

    .footer p {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg-muted);
    }

    .footer a {
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 150ms var(--ease);
    }

    .footer a:hover {
      color: var(--accent);
    }

    /* ─── Modal ────────────────────────────────────────────────────── */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 18px;
      color: var(--fg-muted);
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      transition: color 150ms var(--ease);
    }

    .modal-close:hover {
      color: var(--fg);
    }

    .modal-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .modal h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 10px;
    }

    .modal p {
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--fg-body);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .modal-input-group {
      margin-bottom: 16px;
    }

    .modal-input-group label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 8px;
    }

    .modal-input-group input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0;
      outline: none;
      transition: border-color 150ms var(--ease);
    }

    .modal-input-group input[type="email"]:focus {
      border-color: var(--accent);
    }

    .modal-input-group input[type="email"]::placeholder {
      color: var(--fg-muted);
      opacity: 0.5;
    }

    .modal-error {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--error);
      margin-top: 6px;
      letter-spacing: 0.5px;
      display: none;
    }

    .modal-error.visible {
      display: block;
    }

    .btn-modal-submit {
      width: 100%;
      padding: 12px 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 0;
      cursor: pointer;
      transition: background 150ms var(--ease), color 150ms var(--ease);
    }

    .btn-modal-submit:hover {
      background: var(--accent-hover);
      color: var(--on-accent);
    }

    .btn-modal-submit:disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }

    /* ─── Mobile ───────────────────────────────────────────────────── */

    @media (max-width: 480px) {
      .container {
        padding: 48px 24px 40px;
      }

      .header h1 {
        font-size: 1.875rem;
      }

      .modal {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Email gate modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-eyebrow">Free tool</div>
      <h2 id="modal-title">Get your results</h2>
      <p>Get the formatted list plus occasional tips for data analysts.</p>
      <div class="modal-input-group">
        <label for="email-input">Email address</label>
        <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email">
        <div class="modal-error" id="email-error">Please enter a valid email address.</div>
      </div>
      <button class="btn-modal-submit" id="modal-submit">Get my results →</button>
    </div>
  </div>

  <nav class="nav">
    <a href="https://summerhamil10.com" class="nav-wordmark">Summer Hamilton</a>
    <a href="https://summerhamil10.com" class="nav-back">← Back</a>
  </nav>

  <div class="container">
    <header class="header">
      <div class="eyebrow">Tool</div>
      <h1>SQL ID Formatter</h1>
      <p>Paste IDs from a spreadsheet. Get them formatted for SQL in one click.</p>
    </header>

    <hr class="divider">

    <main>
      <div class="section">
        <label class="field-label" for="input-ids">Paste your IDs (one per line)</label>
        <textarea id="input-ids" placeholder="1001&#10;1002&#10;1003" spellcheck="false"></textarea>

        <div class="format-selector" role="group" aria-label="Output format">
          <div class="format-option">
            <input type="radio" name="format" id="format-auto" value="auto" checked>
            <label for="format-auto">Auto-detect</label>
          </div>
          <div class="format-option">
            <input type="radio" name="format" id="format-numeric" value="numeric">
            <label for="format-numeric">Numeric</label>
          </div>
          <div class="format-option">
            <input type="radio" name="format" id="format-string" value="string">
            <label for="format-string">String</label>
          </div>
        </div>
      </div>

      <button class="btn-primary" id="format-btn">Format IDs →</button>

      <div class="output-section" id="output-section">
        <div class="output-header">
          <label class="field-label" for="output-text">Your formatted list</label>
          <button class="btn-copy" id="copy-btn">Copy →</button>
        </div>
        <textarea id="output-text" readonly spellcheck="false"></textarea>
        <div class="status-line" id="status-line"></div>
        <button class="reset-link" id="reset-btn">Format another list →</button>
      </div>
    </main>
  </div>

  <footer class="footer">
    <p>© 2026 <a href="https://summerhamil10.com">Summer Hamilton</a> · summerhamil10.com</p>
  </footer>

  <script>
    const MAILERLITE_API_KEY  = '[FILL IN: your MailerLite API key]';
    const MAILERLITE_GROUP_ID = '[FILL IN: your MailerLite group ID]';

    const EMAIL_FLAG = 'sql_formatter_email_submitted';

    const inputEl       = document.getElementById('input-ids');
    const formatBtn     = document.getElementById('format-btn');
    const outputSection = document.getElementById('output-section');
    const outputEl      = document.getElementById('output-text');
    const statusEl      = document.getElementById('status-line');
    const copyBtn       = document.getElementById('copy-btn');
    const resetBtn      = document.getElementById('reset-btn');

    const modalOverlay  = document.getElementById('modal-overlay');
    const modalClose    = document.getElementById('modal-close');
    const emailInput    = document.getElementById('email-input');
    const emailError    = document.getElementById('email-error');
    const modalSubmit   = document.getElementById('modal-submit');

    // ─── Format logic ────────────────────────────────────────────────

    function getSelectedFormat() {
      return document.querySelector('input[name="format"]:checked').value;
    }

    function isNumeric(str) {
      return /^-?\d+(\.\d+)?$/.test(str.trim());
    }

    function formatIds(rawText, formatOverride) {
      const lines = rawText
        .split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 0);

      if (lines.length === 0) return null;

      let useNumeric;
      if (formatOverride === 'numeric') {
        useNumeric = true;
      } else if (formatOverride === 'string') {
        useNumeric = false;
      } else {
        useNumeric = lines.every(isNumeric);
      }

      const formatted = useNumeric
        ? lines.join(', ')
        : lines.map(l => `'${l}'`).join(', ');

      return { formatted, count: lines.length, type: useNumeric ? 'numeric' : 'string' };
    }

    function showOutput(result) {
      outputEl.value = result.formatted;
      statusEl.textContent = `${result.count} ID${result.count !== 1 ? 's' : ''} formatted as ${result.type}`;
      outputSection.classList.add('visible');
    }

    // ─── Format button ────────────────────────────────────────────────

    formatBtn.addEventListener('click', function () {
      const lines = inputEl.value.split('\n').filter(l => l.trim().length > 0);
      if (lines.length === 0) { inputEl.focus(); return; }

      if (localStorage.getItem(EMAIL_FLAG) === 'true') {
        const result = formatIds(inputEl.value, getSelectedFormat());
        if (result) showOutput(result);
      } else {
        openModal();
      }
    });

    // ─── Modal ────────────────────────────────────────────────────────

    function openModal() {
      modalOverlay.classList.add('visible');
      emailInput.focus();
    }

    function closeModal() {
      modalOverlay.classList.remove('visible');
      emailError.classList.remove('visible');
      modalSubmit.disabled = false;
      modalSubmit.textContent = 'Get my results →';
    }

    modalClose.addEventListener('click', closeModal);

    modalOverlay.addEventListener('click', function (e) {
      if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modalOverlay.classList.contains('visible')) closeModal();
    });

    function validateEmail(email) {
      return email.includes('@') && email.includes('.');
    }

    async function submitToMailerLite(email) {
      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        if (!response.ok) {
          const body = await response.text();
          console.error('Subscribe API error:', response.status, body);
        }
      } catch (err) {
        console.error('Subscribe request failed:', err);
      }
    }

    emailInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') modalSubmit.click();
    });

    modalSubmit.addEventListener('click', async function () {
      const email = emailInput.value.trim();
      if (!validateEmail(email)) {
        emailError.classList.add('visible');
        emailInput.focus();
        return;
      }

      emailError.classList.remove('visible');
      modalSubmit.disabled = true;
      modalSubmit.textContent = 'Submitting…';

      submitToMailerLite(email);

      localStorage.setItem(EMAIL_FLAG, 'true');
      closeModal();

      const result = formatIds(inputEl.value, getSelectedFormat());
      if (result) showOutput(result);
    });

    // ─── Copy ─────────────────────────────────────────────────────────

    copyBtn.addEventListener('click', function () {
      const text = outputEl.value;
      if (!text) return;

      navigator.clipboard.writeText(text).then(function () {
        copyBtn.textContent = 'Copied ✓';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = 'Copy →';
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(function () {
        outputEl.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Copied ✓';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = 'Copy →';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });

    // ─── Reset ────────────────────────────────────────────────────────

    resetBtn.addEventListener('click', function () {
      inputEl.value = '';
      outputEl.value = '';
      statusEl.textContent = '';
      outputSection.classList.remove('visible');
      document.getElementById('format-auto').checked = true;
      inputEl.focus();
    });
  </script>
</body>
</html>
